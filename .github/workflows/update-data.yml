name: Update Vietlott data

on:
  schedule:
    # Draws are at 18:00 Vietnam time (11:00 UTC); results and new jackpot estimates follow soon after.
    - cron: "15 12 * * *"   # 19:15 VN
    - cron: "0 15 * * *"    # 22:00 VN
    - cron: "0 1 * * *"     # 08:00 VN
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jackpots and prize table from vietlott.vn
        run: python scripts/fetch_vietlott.py data/vietlott.json

      - name: Commit if changed
        run: |
          git add data/vietlott.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update vietlott $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
